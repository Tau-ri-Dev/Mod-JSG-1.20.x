plugins {
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
if (mod_version.contains("Dev"))
    version = mod_version + (new Date().format(build_with_millis == "true" ? 'yyyyMMdd-HHmmss' : 'yyyyMMdd'))
else
    version = mod_version

base {
    archivesName = build_extrapath + "-" + minecraft_version
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    accessTransformers.from file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath,
                    '--existing-mod', 'jsg_core'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

if (enable_oc2 != "true") {
    sourceSets.main.java.exclude 'dev/tauri/jsg/common/integration/oc2/**'
}

repositories {
    mavenCentral()
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "org.jspecify:jspecify:1.0.0"

    // jsg-core: built locally from the sibling project (no publishing)
    implementation files("Mod-JSGCore-1.21.x/build/libs/jsg-core-${minecraft_version}-${core_version}.jar")

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // CC:Tweaked keeps the "-forge" artifact naming for its NeoForge builds on 1.21.1
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cct_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cct_version}"
    localRuntime "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cct_version}"

    localRuntime "maven.modrinth:stellarview:${stellarview_version}"
    localRuntime "dev.matrixlab:webp4j:1.4.0"

    // OC2 / Tinkers: no 1.21.x builds (see enable_oc2); Create/Mekanism runtime deps
    // return in M9/M10 once integration code is ported.
    //compileOnly "li.cil:oc2:1.0"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '5000'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            core_version_range     : core_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
